database_path: data/arxiv_agent.db
lookback_hours: 30
max_results_per_category: 120
arxiv_page_size: 200
arxiv_min_request_interval_seconds: 3.0
arxiv_max_retries: 6
request_timeout_seconds: 30
user_agent: arxiv-agent/0.1 (mailto:your_email@example.com)

model:
  enabled: false
  # openai | openai_compatible | ollama
  provider: openai
  # For openai/openai_compatible this should be an OpenAI-style base URL.
  # Examples:
  #   OpenAI: https://api.openai.com/v1
  #   DeepSeek: https://api.deepseek.com/v1
  #   Qwen (DashScope compatible): https://dashscope.aliyuncs.com/compatible-mode/v1
  #   Local OpenAI-compatible gateway: http://127.0.0.1:8000/v1
  #   Ollama: http://127.0.0.1:11434
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  # For local openai-compatible endpoints without auth, set require_api_key: false.
  require_api_key: true
  model: gpt-5-mini
  # For Ollama, use local model names (e.g. qwen2.5:7b, deepseek-r1:8b).
  embedding_model: text-embedding-3-large
  timeout_seconds: 60

notify:
  console: true
  email:
    enabled: false
    smtp_host: smtp.gmail.com
    smtp_port: 587
    username: your_account@gmail.com
    password_env: SMTP_PASSWORD
    from_addr: your_account@gmail.com
    to_addrs:
      - your_account@gmail.com
    use_tls: true
  telegram:
    enabled: false
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id: ""

schedule:
  timezone: Europe/Paris
  hour: 8
  minute: 0
