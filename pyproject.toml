[project]
name = "arxiv-agent"
version = "0.1.0"
description = "Daily arXiv monitoring, summarization, and notifications"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "apscheduler>=3.10.4",
  "feedparser>=6.0.11",
  "httpx>=0.27.2",
  "pydantic>=2.9.2",
  "pyyaml>=6.0.2",
  "streamlit>=1.40.0",
  "tenacity>=9.0.0",
  "typer>=0.12.5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "ruff>=0.6.9"
]

[project.scripts]
arxiv-agent = "arxiv_agent.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
